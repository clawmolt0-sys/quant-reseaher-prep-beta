<!DOCTYPE html>
<html>
<head>
  <title>Feature Debug</title>
  <link rel="stylesheet" href="css/auth.css">
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; max-width: 900px; margin: 0 auto; }
    #log { max-height: 400px; overflow-y: auto; border: 1px solid #333; padding: 8px; border-radius: 8px; margin-top: 16px; }
    #log div { padding: 3px 6px; margin: 1px 0; border-radius: 3px; font-size: 12px; word-break: break-all; }
    .ok { background: #1a3a2a; color: #4ade80; }
    .err { background: #3a1a1a; color: #f87171; }
    .info { background: #1a2a3a; color: #60a5fa; }
    .warn { background: #3a2a1a; color: #fbbf24; }
    button { padding: 10px 20px; margin: 4px; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .g { background: #22c55e; color: white; }
    .b { background: #3b82f6; color: white; }
    .r { background: #ef4444; color: white; }
    .y { background: #eab308; color: #1a1a2e; }
    .p { background: #8b5cf6; color: white; }
    h2 { color: #60a5fa; margin-top: 24px; }
    h3 { color: #a78bfa; margin-top: 16px; margin-bottom: 8px; }
    .section { border: 1px solid #333; border-radius: 8px; padding: 16px; margin: 12px 0; }
    .demo-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 12px; background: #0f0f1e; border-radius: 8px; margin: 8px 0; }
  </style>
</head>
<body>
  <h2>ðŸ”§ Feature Debug Page</h2>

  <div class="section">
    <h3>1. Auth & Firestore</h3>
    <button class="g" onclick="doPopup()">Sign In (Popup)</button>
    <button class="b" onclick="dumpFirestore()">Dump Full User Doc</button>
    <button class="r" onclick="doSignOut()">Sign Out</button>
    <button class="p" onclick="testWrite()">Test Write Progress #1=solved</button>
    <button class="y" onclick="testReadBack()">Read Back Progress</button>
  </div>

  <div class="section">
    <h3>2. Toast & Animation Test</h3>
    <p style="font-size:12px;color:#888">These test the CSS animations directly (no Firestore involved)</p>
    <div class="demo-bar">
      <div class="problem-action-bar" id="demo-action-bar" style="display:flex;gap:8px;align-items:center;">
        <button class="pab__btn" id="demo-solved" onclick="demoSolved()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
          <span>Solved</span>
        </button>
        <button class="pab__btn" id="demo-attempted" onclick="demoAttempted()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
          <span>Attempted</span>
        </button>
        <div class="pab__sep"></div>
        <button class="pab__icon-btn" id="demo-heart" onclick="demoHeart()">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
        </button>
      </div>
    </div>
    <button class="p" onclick="demoToast()">Test Toast</button>
    <button class="p" onclick="demoXPToast()">Test XP Toast</button>
  </div>

  <div class="section">
    <h3>3. Tier Check</h3>
    <button class="b" onclick="checkTier()">Check Auth.getTier()</button>
    <button class="y" onclick="checkLocked()">Check isProblemLocked(id=250)</button>
  </div>

  <div class="section">
    <h3>4. Collections Test</h3>
    <button class="g" onclick="testCreateCollection()">Create Test Collection</button>
    <button class="b" onclick="dumpCollections()">Dump Collections</button>
  </div>

  <div id="log"></div>

  <!-- Load all site scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Minimal App shim for Auth.js
    if (typeof App === 'undefined') {
      window.App = {
        getParams: () => ({}),
        setParams: () => {},
        escapeHtml: s => s,
      };
    }
    if (typeof DataLoader === 'undefined') {
      window.DataLoader = {
        problems: () => Promise.resolve([]),
        problemsIndex: () => Promise.resolve([]),
      };
    }
    if (typeof Collections === 'undefined') {
      window.Collections = { showModal: () => {} };
    }

    var L = document.getElementById('log');
    function log(m, c) {
      var d = document.createElement('div');
      d.className = c || 'info';
      d.textContent = new Date().toLocaleTimeString() + '  ' + m;
      L.prepend(d);
    }

    // Init Auth
    log('Initializing Auth...');
    // Provide a mock auth-container so Auth.init() doesn't fail
    if (!document.getElementById('auth-container')) {
      var ac = document.createElement('div');
      ac.id = 'auth-container';
      ac.style.display = 'none';
      document.body.appendChild(ac);
    }
    Auth.init();
    log('Auth.init() called', 'ok');

    // Listen for auth state
    window.addEventListener('auth-state-changed', (e) => {
      log('auth-state-changed event: loggedIn=' + e.detail.loggedIn + (e.detail.user ? ' user=' + e.detail.user.email : ''), 'ok');
      if (e.detail.loggedIn) {
        var doc = Auth.getUserDoc();
        if (doc) {
          log('  userDoc loaded: tier=' + (doc.tier||'?') + ' xp=' + (doc.xp||0) + ' progress=' + Object.keys(doc.progress||{}).length + ' entries', 'ok');
        }
      }
    });

    // ---- Auth ----
    async function doPopup() {
      log('Starting popup sign-in...');
      await Auth.signInWithGoogle();
      log('signInWithGoogle returned', 'ok');
    }
    function doSignOut() {
      Auth.signOut();
      log('Signed out', 'ok');
    }

    // ---- Firestore dump ----
    async function dumpFirestore() {
      if (!Auth.isLoggedIn()) { log('Not signed in!', 'err'); return; }
      var user = Auth.getUser();
      log('Dumping Firestore for ' + user.email + ' (uid=' + user.uid + ')...');
      try {
        var db = FirebaseConfig.getDb();
        var snap = await db.collection('users').doc(user.uid).get();
        if (!snap.exists) { log('NO USER DOC EXISTS!', 'err'); return; }
        var data = snap.data();
        log('--- Firestore User Doc ---', 'warn');
        log('tier: ' + (data.tier || 'not set'), 'ok');
        log('xp: ' + (data.xp || 0) + ', level: ' + (data.level || 0), 'ok');
        var s = data.stats || {};
        log('stats.easy: ' + JSON.stringify(s.easy || {}), 'ok');
        log('stats.medium: ' + JSON.stringify(s.medium || {}), 'ok');
        log('stats.hard: ' + JSON.stringify(s.hard || {}), 'ok');
        var p = data.progress || {};
        var pKeys = Object.keys(p);
        log('progress: ' + pKeys.length + ' entries', pKeys.length > 0 ? 'ok' : 'warn');
        if (pKeys.length > 0) {
          var solved = pKeys.filter(k => p[k]==='solved').length;
          var attempted = pKeys.filter(k => p[k]==='attempted').length;
          log('  solved=' + solved + ', attempted=' + attempted, 'ok');
          log('  first 20: ' + pKeys.slice(0,20).map(k => k+'='+p[k]).join(', '), 'info');
        } else {
          log('  NO PROGRESS DATA â€” this is why profile shows zeros!', 'err');
        }
        log('favorites: ' + JSON.stringify(data.favorites || []), 'ok');
        log('collections: ' + (data.collections || []).length + ' lists', 'ok');
        log('streak: ' + JSON.stringify(data.streak || {}), 'ok');
        log('--- Local userDoc ---', 'warn');
        var localDoc = Auth.getUserDoc();
        if (localDoc) {
          var lp = localDoc.progress || {};
          log('local progress: ' + Object.keys(lp).length + ' entries', 'ok');
        } else {
          log('LOCAL userDoc IS NULL!', 'err');
        }
      } catch(e) {
        log('ERROR: ' + (e.code||'') + ' ' + e.message, 'err');
      }
    }

    // ---- Write test ----
    async function testWrite() {
      if (!Auth.isLoggedIn()) { log('Not signed in!', 'err'); return; }
      log('Calling Auth.saveStatus(1, "solved")...');
      try {
        await Auth.saveStatus(1, 'solved');
        log('saveStatus returned OK', 'ok');
        log('Local userDoc.progress: ' + JSON.stringify(Auth.getUserDoc()?.progress || {}), 'info');
      } catch(e) {
        log('saveStatus ERROR: ' + e.message, 'err');
      }
    }

    async function testReadBack() {
      if (!Auth.isLoggedIn()) { log('Not signed in!', 'err'); return; }
      log('Reading back from Firestore...');
      try {
        var db = FirebaseConfig.getDb();
        var snap = await db.collection('users').doc(Auth.getUser().uid).get();
        var data = snap.data();
        log('Firestore progress[1] = ' + ((data.progress||{})['1'] || 'NOT SET'), data.progress?.['1'] ? 'ok' : 'err');
        log('Firestore xp = ' + (data.xp||0) + ', stats = ' + JSON.stringify(data.stats||{}), 'ok');
      } catch(e) {
        log('ERROR: ' + e.message, 'err');
      }
    }

    // ---- Toast/Animation demos ----
    function showTestToast(message, type) {
      var existing = document.querySelector('.qr-toast');
      if (existing) existing.remove();
      var toast = document.createElement('div');
      toast.className = 'qr-toast' + (type === 'xp' ? ' qr-toast--xp' : '');
      toast.textContent = message;
      document.body.appendChild(toast);
      log('Toast created: ' + toast.className + ', opacity: ' + getComputedStyle(toast).opacity, 'info');
      requestAnimationFrame(() => {
        toast.classList.add('qr-toast--show');
        log('Toast shown: opacity=' + getComputedStyle(toast).opacity + ', transform=' + getComputedStyle(toast).transform, 'ok');
      });
      setTimeout(() => {
        toast.classList.remove('qr-toast--show');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    function demoToast() { showTestToast('âœ… Test toast message'); }
    function demoXPToast() { showTestToast('âœ… Solved! +25 XP', 'xp'); }

    function demoSolved() {
      var btn = document.getElementById('demo-solved');
      btn.className = 'pab__btn pab__btn--active-green';
      btn.classList.add('pab__btn--anim-green');
      var floater = document.createElement('span');
      floater.className = 'pab__xp-float';
      floater.textContent = '+25 XP';
      btn.style.position = 'relative';
      btn.appendChild(floater);
      log('Animation class added: ' + btn.className, 'ok');
      log('Floater computed: ' + getComputedStyle(floater).animation, 'info');
      setTimeout(() => { floater.remove(); btn.classList.remove('pab__btn--anim-green'); }, 1000);
      showTestToast('âœ… Solved! +25 XP', 'xp');
    }

    function demoAttempted() {
      var btn = document.getElementById('demo-attempted');
      btn.className = 'pab__btn pab__btn--active-yellow';
      btn.classList.add('pab__btn--anim-yellow');
      log('Attempted animation class: ' + btn.className, 'ok');
      setTimeout(() => btn.classList.remove('pab__btn--anim-yellow'), 500);
      showTestToast('ðŸŸ¡ Marked as attempted');
    }

    function demoHeart() {
      var btn = document.getElementById('demo-heart');
      btn.classList.toggle('pab__icon-btn--liked');
      btn.classList.add('pab__icon-btn--anim-heart');
      var svg = btn.querySelector('svg');
      if (btn.classList.contains('pab__icon-btn--liked')) {
        svg.setAttribute('fill', 'currentColor');
        showTestToast('â¤ï¸ Added to favorites');
      } else {
        svg.setAttribute('fill', 'none');
        showTestToast('Removed from favorites');
      }
      log('Heart toggle: liked=' + btn.classList.contains('pab__icon-btn--liked'), 'ok');
      setTimeout(() => btn.classList.remove('pab__icon-btn--anim-heart'), 500);
    }

    // ---- Tier ----
    function checkTier() {
      if (!Auth.isLoggedIn()) { log('Not signed in!', 'err'); return; }
      var tier = Auth.getTier();
      var user = Auth.getUser();
      log('getTier() = "' + tier + '", email = ' + user.email, tier === 'pro' ? 'ok' : 'warn');
      log('ADMIN_EMAILS check: alexwuyinchen@gmail.com -> isAdmin should be true', 'info');
    }

    function checkLocked() {
      if (!Auth.isLoggedIn()) { log('Not signed in!', 'err'); return; }
      var tier = Auth.getTier();
      var locked = tier !== 'pro' && 250 > 200;
      log('Problem #250 locked? ' + locked + ' (tier=' + tier + ')', locked ? 'err' : 'ok');
    }

    // ---- Collections ----
    async function testCreateCollection() {
      if (!Auth.isLoggedIn()) { log('Not signed in!', 'err'); return; }
      log('Creating test collection...');
      try {
        var db = FirebaseConfig.getDb();
        var user = Auth.getUser();
        var doc = Auth.getUserDoc();
        log('  getUserDoc(): ' + (doc ? 'exists' : 'NULL'), doc ? 'ok' : 'err');
        if (!doc) { log('  Cannot create â€” no userDoc!', 'err'); return; }

        if (!doc.collections) doc.collections = [];
        var newCol = { id: 'test-' + Date.now(), name: 'Debug List ' + Date.now(), problemIds: [], createdAt: new Date().toISOString() };
        doc.collections.push(newCol);
        await db.collection('users').doc(user.uid).set({ collections: doc.collections }, { merge: true });
        log('Collection created: ' + newCol.name, 'ok');
      } catch(e) {
        log('ERROR: ' + (e.code||'') + ' ' + e.message, 'err');
      }
    }

    async function dumpCollections() {
      if (!Auth.isLoggedIn()) { log('Not signed in!', 'err'); return; }
      var doc = Auth.getUserDoc();
      var cols = doc?.collections || [];
      log('Collections: ' + cols.length, cols.length > 0 ? 'ok' : 'warn');
      cols.forEach(c => log('  ' + c.name + ' (' + c.problemIds.length + ' problems)', 'info'));
    }

    log('Page ready. Sign in first, then test features.', 'warn');
  </script>
</body>
</html>
