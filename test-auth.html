<!DOCTYPE html>
<html>
<head>
  <title>Auth + Firestore Test</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; max-width: 800px; margin: 0 auto; }
    .test { padding: 8px 12px; margin: 4px 0; border-radius: 6px; }
    .pass { background: #1a3a2a; color: #4ade80; }
    .fail { background: #3a1a1a; color: #f87171; }
    .info { background: #1a2a3a; color: #60a5fa; }
    .warn { background: #3a2a1a; color: #fbbf24; }
    button { padding: 10px 20px; margin: 8px 4px; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; }
    .btn-run { background: #3b82f6; color: white; }
    .btn-sign { background: #22c55e; color: white; }
    h2 { color: #60a5fa; }
  </style>
</head>
<body>
  <h2>QR Prep — Auth & Firestore Test</h2>
  <div>
    <button class="btn-sign" onclick="doSignIn()">Sign In with Google</button>
    <button class="btn-run" onclick="testFirestore()">Test Firestore Read/Write</button>
  </div>
  <div id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script>
    var logEl = document.getElementById('log');
    function log(msg, cls) {
      var d = document.createElement('div');
      d.className = 'test ' + (cls || 'info');
      d.textContent = new Date().toLocaleTimeString() + ' ' + msg;
      logEl.appendChild(d);
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ---- Step 0: Nuke ALL corrupted IndexedDB BEFORE Firebase init ----
    log('Cleaning corrupted IndexedDB databases...');
    try {
      indexedDB.deleteDatabase('firebaseLocalStorageDb');
      indexedDB.deleteDatabase('firestore/[DEFAULT]/qrprep/main');
      indexedDB.deleteDatabase('firestore/[DEFAULT]/qrprep');
      indexedDB.deleteDatabase('firebase-heartbeat-database');
      indexedDB.deleteDatabase('firebase-installations-database');
      log('IndexedDB cleanup done', 'pass');
    } catch(e) {
      log('IndexedDB cleanup error: ' + e.message, 'warn');
    }

    // ---- Step 1: Firebase init ----
    log('Initializing Firebase...');

    if (firebase.apps.length === 0) {
      firebase.initializeApp({
        apiKey: "AIzaSyDGlaIXU9u0RwWoepLR45hJGlpIOREbQ1A",
        authDomain: "qrprep.firebaseapp.com",
        projectId: "qrprep",
        storageBucket: "qrprep.firebasestorage.app",
        messagingSenderId: "269729809695",
        appId: "1:269729809695:web:4379017f0e6bec69e7dc2a"
      });
    }

    log('firebase.initializeApp() done. apps=' + firebase.apps.length);

    var auth = firebase.auth();
    var db = firebase.firestore();

    log('Got auth and db objects');

    // Firestore settings
    try {
      db.settings({
        experimentalForceLongPolling: true,
        experimentalAutoDetectLongPolling: false,
        merge: true
      });
      log('Firestore long-polling enabled');
    } catch(e) {
      log('Firestore settings: ' + e.message, 'warn');
    }

    // Register auth listener IMMEDIATELY (not in setTimeout)
    log('Registering onAuthStateChanged listener NOW...');
    var authStartTime = Date.now();

    auth.onAuthStateChanged(function(user) {
      var elapsed = Date.now() - authStartTime;
      if (user) {
        log('onAuthStateChanged: SIGNED IN as ' + user.displayName + ' (' + user.email + ') [' + elapsed + 'ms]', 'pass');
      } else {
        log('onAuthStateChanged: NOT SIGNED IN [' + elapsed + 'ms] — click Sign In button', 'warn');
      }
    });

    log('Listener registered. Waiting for callback...');

    // Also set a watchdog timer
    setTimeout(function() {
      log('=== 10s watchdog: if you see no auth callback above, Firebase Auth is hanging ===', 'fail');
      log('This usually means the Firebase auth iframe at qrprep.firebaseapp.com is blocked.', 'fail');
      log('Try: (1) Clear all site data, (2) Disable ad blockers, (3) Check browser console', 'fail');
    }, 10000);

    // Sign in
    async function doSignIn() {
      try {
        log('Opening Google sign-in popup...');
        var provider = new firebase.auth.GoogleAuthProvider();
        var result = await auth.signInWithPopup(provider);
        log('Sign-in SUCCESS: ' + result.user.displayName, 'pass');
      } catch(e) {
        log('Sign-in error: ' + e.code + ' — ' + e.message, 'fail');
        if (e.code === 'auth/unauthorized-domain') {
          log('Domain ' + window.location.hostname + ' is not authorized in Firebase Console', 'fail');
        }
      }
    }

    // Firestore test
    async function testFirestore() {
      var user = auth.currentUser;
      if (!user) {
        log('Not signed in! Sign in first.', 'fail');
        return;
      }

      // Read test
      log('Testing Firestore READ...');
      try {
        var t0 = Date.now();
        var timeout = new Promise(function(_, rej) { setTimeout(function() { rej(new Error('READ TIMEOUT 10s')); }, 10000); });
        var snap = await Promise.race([db.collection('users').doc(user.uid).get(), timeout]);
        var elapsed = Date.now() - t0;
        if (snap.exists) {
          var data = snap.data();
          log('READ OK (' + elapsed + 'ms) — progress: ' + Object.keys(data.progress || {}).length + ', xp: ' + (data.xp || 0), 'pass');
        } else {
          log('READ OK (' + elapsed + 'ms) — doc does not exist yet', 'pass');
        }
      } catch(e) {
        log('READ FAILED: ' + (e.code || '') + ' ' + e.message, 'fail');
        if (e.code === 'permission-denied') log('>>> FIRESTORE RULES EXPIRED! Update in Firebase Console.', 'fail');
        return;
      }

      // Write test
      log('Testing Firestore WRITE (set+merge)...');
      try {
        var docRef = db.collection('users').doc(user.uid);
        var t1 = Date.now();
        var wtimeout = new Promise(function(_, rej) { setTimeout(function() { rej(new Error('WRITE TIMEOUT 10s')); }, 10000); });
        await Promise.race([docRef.set({ _test: Date.now() }, { merge: true }), wtimeout]);
        var welapsed = Date.now() - t1;
        // cleanup
        await docRef.update({ _test: firebase.firestore.FieldValue.delete() });
        log('WRITE OK (' + welapsed + 'ms)', 'pass');
      } catch(e) {
        log('WRITE FAILED: ' + (e.code || '') + ' ' + e.message, 'fail');
        if (e.code === 'permission-denied') log('>>> FIRESTORE RULES EXPIRED!', 'fail');
      }

      // Nested update test
      log('Testing Firestore UPDATE (nested field)...');
      try {
        var docRef2 = db.collection('users').doc(user.uid);
        var t2 = Date.now();
        var utimeout = new Promise(function(_, rej) { setTimeout(function() { rej(new Error('UPDATE TIMEOUT 10s')); }, 10000); });
        await Promise.race([docRef2.update({ 'progress.test-999': 'solved' }), utimeout]);
        var uelapsed = Date.now() - t2;
        await docRef2.update({ 'progress.test-999': firebase.firestore.FieldValue.delete() });
        log('UPDATE OK (' + uelapsed + 'ms)', 'pass');
      } catch(e) {
        log('UPDATE FAILED: ' + (e.code || '') + ' ' + e.message, 'fail');
      }

      log('=== ALL FIRESTORE TESTS DONE ===', 'pass');
    }
  </script>
</body>
</html>
