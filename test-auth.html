<!DOCTYPE html>
<html>
<head>
  <title>Auth Test</title>
  <style>
    body { font-family: monospace; background: #1a1a2e; color: #e0e0e0; padding: 20px; }
    #log div { padding: 4px 8px; margin: 2px 0; border-radius: 4px; font-size: 13px; }
    .ok { background: #1a3a2a; color: #4ade80; }
    .err { background: #3a1a1a; color: #f87171; }
    .info { background: #1a2a3a; color: #60a5fa; }
    .warn { background: #3a2a1a; color: #fbbf24; }
    button { padding: 12px 24px; margin: 6px; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; font-weight: 700; }
    .g { background: #22c55e; color: white; }
    .b { background: #3b82f6; color: white; }
    .r { background: #ef4444; color: white; }
  </style>
</head>
<body>
  <h2 style="color:#60a5fa">Auth Test</h2>
  <div>
    <button class="g" onclick="signIn()">Sign In with Google (Redirect)</button>
    <button class="b" onclick="testFirestore()">Test Firestore</button>
    <button class="r" onclick="signOut()">Sign Out</button>
  </div>
  <div id="log"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script>
    var L = document.getElementById('log');
    function log(m, c) {
      var d = document.createElement('div');
      d.className = c || 'info';
      d.textContent = new Date().toLocaleTimeString() + '  ' + m;
      L.appendChild(d);
    }

    // Init — same as the real app's firebase-config.js
    firebase.initializeApp({
      apiKey: "AIzaSyDGlaIXU9u0RwWoepLR45hJGlpIOREbQ1A",
      authDomain: "qrprep.firebaseapp.com",
      projectId: "qrprep",
      storageBucket: "qrprep.firebasestorage.app",
      messagingSenderId: "269729809695",
      appId: "1:269729809695:web:4379017f0e6bec69e7dc2a"
    });
    var auth = firebase.auth();
    var db = firebase.firestore();
    log('Firebase initialized', 'ok');

    // Auth state
    auth.onAuthStateChanged(function(user) {
      if (user) {
        log('Signed in: ' + user.displayName + ' (' + user.email + ')', 'ok');
      } else {
        log('Not signed in', 'warn');
      }
    });

    // Check redirect result
    auth.getRedirectResult().then(function(result) {
      if (result && result.user) {
        log('Redirect sign-in success: ' + result.user.displayName, 'ok');
      }
    }).catch(function(e) {
      log('getRedirectResult error: ' + e.code + ' — ' + e.message, 'err');
    });

    function signIn() {
      var provider = new firebase.auth.GoogleAuthProvider();
      auth.signInWithRedirect(provider);
    }

    function signOut() {
      auth.signOut().then(function() { log('Signed out', 'ok'); });
    }

    async function testFirestore() {
      if (!auth.currentUser) { log('Sign in first', 'err'); return; }
      try {
        var snap = await db.collection('users').doc(auth.currentUser.uid).get();
        log('Read OK: ' + (snap.exists ? 'xp=' + (snap.data().xp||0) : 'no doc'), 'ok');
        await db.collection('users').doc(auth.currentUser.uid).set({_test: Date.now()}, {merge:true});
        await db.collection('users').doc(auth.currentUser.uid).update({_test: firebase.firestore.FieldValue.delete()});
        log('Write OK', 'ok');
      } catch(e) {
        log('Firestore error: ' + (e.code||'') + ' ' + e.message, 'err');
      }
    }
  </script>
</body>
</html>
