<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="qGrad" x1="6" y1="6" x2="26" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="accent" x1="16" y1="18" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="0.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Subtle grid lines for 'quantitative' feel -->
  <line x1="8" y1="8" x2="8" y2="25" stroke="#6366f1" stroke-width="0.3" opacity="0.4"/>
  <line x1="14" y1="8" x2="14" y2="25" stroke="#6366f1" stroke-width="0.3" opacity="0.4"/>
  <line x1="20" y1="8" x2="20" y2="25" stroke="#6366f1" stroke-width="0.3" opacity="0.4"/>
  <line x1="26" y1="8" x2="26" y2="25" stroke="#6366f1" stroke-width="0.3" opacity="0.4"/>
  <line x1="6" y1="12" x2="27" y2="12" stroke="#6366f1" stroke-width="0.3" opacity="0.4"/>
  <line x1="6" y1="18" x2="27" y2="18" stroke="#6366f1" stroke-width="0.3" opacity="0.4"/>
  <line x1="6" y1="24" x2="27" y2="24" stroke="#6366f1" stroke-width="0.3" opacity="0.4"/>
  <!-- Stylized "Q" letter -->
  <circle cx="15" cy="14.5" r="7.5" stroke="url(#qGrad)" stroke-width="2.8" fill="none" filter="url(#glow)"/>
  <!-- Q tail — diagonal slash suggesting a trend line -->
  <line x1="19" y1="19" x2="26" y2="26" stroke="url(#accent)" stroke-width="2.8" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Small sigma symbol inside Q for 'quantitative' -->
  <text x="15" y="17.5" text-anchor="middle" font-family="serif" font-size="9" font-weight="700" fill="url(#qGrad)" opacity="0.85">Σ</text>
</svg>
