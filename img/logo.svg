<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="chart" x1="6" y1="24" x2="26" y2="8" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>
  <!-- Stylized Q made of chart bars + rising line -->
  <rect x="7" y="18" width="3.5" height="7" rx="1" fill="url(#chart)" opacity="0.7"/>
  <rect x="12" y="14" width="3.5" height="11" rx="1" fill="url(#chart)" opacity="0.85"/>
  <rect x="17" y="10" width="3.5" height="15" rx="1" fill="url(#chart)" opacity="0.9"/>
  <rect x="22" y="6" width="3.5" height="19" rx="1" fill="url(#chart)"/>
  <!-- Rising trend line -->
  <path d="M8.5 17 L13.5 13 L18.5 9 L23.5 5.5" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Dot at peak -->
  <circle cx="23.5" cy="5.5" r="2" fill="#fbbf24"/>
</svg>
